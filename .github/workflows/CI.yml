
name: Model Validation

on:
  push:
    branches: [main]

jobs:
  test-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install dvc cml

      - name: Pull data and model from DVC
        run: |
          dvc pull processed/stocks.parquet.dvc || echo "processed parquet already present"
          dvc pull model.joblib.dvc
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Run pytest
        run: |
          pytest tests/test_inference_parquet.py -q --disable-warnings > pytest_output.txt

      - name: Generate CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🧮 Model Accuracy Report" > report.md
          echo "### Pytest Results" >> report.md
          cat pytest_output.txt >> report.md
          echo "\n### Accuracy Metric" >> report.md
          cat accuracy.txt >> report.md
          cml comment create report.md
