
name: Model Validation

on:
  push:
    branches: [master]

jobs:
  test-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Install dependencies 
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pandas scikit-learn joblib pytest mlflow google-cloud-storage --only-binary=:all:
          pip install dvc dvc-gs 

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure DVC Remote
        run: |
          # Example for GCS remote
          dvc remote add -f test gs://mlops_oppe_1 
          dvc remote default test


      - name: Pull data and model from DVC
        run: |
          dvc pull processed/stocks.parquet.dvc || echo "processed parquet already present"
          dvc pull model.joblib.dvc

      - name: Run pytest
        run: |
          pytest tests/test_inference_parquet.py -q --disable-warnings > pytest_output.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install CML
        run: npm install -g @dvcorg/cml

      - name: Generate CML Report
        env:
          REPO_TOKEN: ${{ secrets.TOKEN }}
        run: |
          echo "## 🧮 Model Accuracy Report" > report.md
          echo "### Pytest Results" >> report.md
          cat pytest_output.txt >> report.md
          echo "\n### Accuracy Metric" >> report.md
          cat accuracy.txt >> report.md
          cml comment create report.md
