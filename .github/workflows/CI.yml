name: Model Accuracy Test

on:
  push:
    branches: [main]

jobs:
  test-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Pull model from DVC
        run: |
          pip install dvc-gcs
          dvc pull model.joblib.dvc
        env:
          # your DVC credentials, e.g.
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Run pytest
        run: |
          pytest --maxfail=1 --disable-warnings -q --tb=short > pytest_output.txt

      - name: Generate accuracy report (CML)
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install cml
          echo "## Model Test Report" > report.md
          echo "### Pytest Results" >> report.md
          cat pytest_output.txt >> report.md
          cml comment create report.md
